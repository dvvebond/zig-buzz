# Local TypeScript gates mirror the workspace CI surfaces. Deletion-only
# changes may be omitted by lefthook file discovery; CI still catches them.
pre-commit:
  parallel: true
  commands:
    workspace-fmt:
      glob: ["apps/**", "packages/**", "examples/**", "scripts/**", "*.{json,ts,mts,yml,yaml}"]
      run: just fmt
      stage_fixed: true
    desktop-fix:
      glob: ["desktop/**", "pnpm-lock.yaml"]
      run: just desktop-fix
      stage_fixed: true
    web-fix:
      glob: ["web/**", "pnpm-lock.yaml"]
      run: just web-fix
      stage_fixed: true
    admin-web-fix:
      glob: ["admin-web/**", "pnpm-lock.yaml"]
      run: pnpm -C admin-web exec biome check --write .
      stage_fixed: true
    mobile-fix:
      glob: ["apps/mobile/**", "pnpm-lock.yaml"]
      run: just mobile-fix
      stage_fixed: true

# Appends the DCO Signed-off-by trailer the required "DCO Check" enforces.
# `--if-exists doNothing` makes it idempotent and preserves an existing
# sign-off (including `git commit -s` and a different signer's trailer).
commit-msg:
  commands:
    signoff:
      run: 'git interpret-trailers --if-exists doNothing --trailer "Signed-off-by: $(git var GIT_COMMITTER_IDENT | sed ''s/ [0-9]* [+-][0-9]*$//'')" --in-place {1}'

pre-push:
  parallel: true
  commands:
    branch-skew:
      run: ./scripts/check-branch-skew.sh
    workspace-tests:
      glob: ["apps/**", "packages/**", "examples/**", "migrations/**", "schema/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.base.json", "scripts/run-tests.sh", "Justfile"]
      run: just test-unit
    desktop-check:
      glob: ["desktop/**", "pnpm-lock.yaml"]
      run: just desktop-check
    desktop-test:
      glob: ["desktop/**", "pnpm-lock.yaml"]
      run: just desktop-test
    mobile-test:
      glob: ["apps/mobile/**", "pnpm-lock.yaml"]
      run: just mobile-test
