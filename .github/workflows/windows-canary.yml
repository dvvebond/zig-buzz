name: Windows TypeScript Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * 2"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/package-desktop.mts --archive --platform win32-x64-canary
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-windows-typescript-canary
          path: dist/*.tar.gz
