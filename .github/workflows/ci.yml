name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.18.0"

jobs:
  typescript:
    name: TypeScript workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting and strict checks
        run: |
          pnpm format:check
          pnpm check
      - name: Build every production TypeScript target
        run: pnpm build
      - name: Unit and contract tests
        run: ./scripts/run-tests.sh unit

  relay-integration:
    name: Relay integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run network and persistence tests
        run: ./scripts/run-tests.sh integration
      - name: Relay diagnostics
        if: failure()
        run: |
          tail -300 /tmp/buzz-relay.log || true
          docker compose logs --tail=300 || true

  browser-e2e:
    name: Browser clients
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright is a devDependency of the client packages, not the root, and
      # the browser download is a shared machine-level cache, so installing it
      # once from desktop also serves the web and admin-web smoke runs.
      - run: pnpm -C desktop exec playwright install --with-deps chromium
      - name: Desktop smoke
        run: pnpm -C desktop test:e2e:smoke
      - name: Web smoke
        run: pnpm -C web test:e2e:smoke
      - name: Admin client tests
        run: pnpm -C admin-web test

  production-images:
    name: Production images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: buzz-relay:ci
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
      - name: Smoke relay executable
        run: |
          docker run -d --name buzz-relay-ci \
            -e BUZZ_HOST=0.0.0.0 \
            -e BUZZ_PUBLIC_URL=ws://localhost:3000/ \
            -p 127.0.0.1:3000:3000 \
            buzz-relay:ci
          for attempt in $(seq 1 30); do
            body=$(curl -fsS -H 'Host: localhost:3000' \
              http://127.0.0.1:3000/_readiness || true)
            test "$body" = '{"status":"ready"}' && exit 0
            sleep 1
          done
          docker logs buzz-relay-ci
          exit 1
      - name: Build push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.push-gateway
          load: true
          tags: buzz-push-gateway:ci
          cache-from: type=gha,scope=push-gateway
          cache-to: type=gha,mode=max,scope=push-gateway

  desktop-packages:
    name: Desktop package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  required:
    name: Required checks
    if: always()
    needs:
      - typescript
      - relay-integration
      - browser-e2e
      - production-images
      - desktop-packages
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(needs)
              .filter(([, value]) => value.result !== "success");
            if (failed.length) {
              console.error(failed);
              process.exit(1);
            }
          '
