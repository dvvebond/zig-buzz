name: macOS TypeScript Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 2"

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64-canary
          - os: macos-15-intel
            platform: darwin-x64-canary
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/package-desktop.mts --archive --platform ${{ matrix.platform }}
      - run: tar -tzf dist/buzz-desktop-${{ matrix.platform }}.tar.gz >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-${{ matrix.platform }}
          path: dist/*.tar.gz
