name: Linux TypeScript Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/package-desktop.mts --archive --platform linux-x64-canary
      - run: tar -tzf dist/buzz-desktop-linux-x64-canary.tar.gz >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-linux-typescript-canary
          path: dist/*.tar.gz
