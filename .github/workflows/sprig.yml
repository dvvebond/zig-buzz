name: Sprig TypeScript

on:
  workflow_dispatch:
  push:
    tags: ["sprig-v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buzz/sprig check
      - run: pnpm --filter @buzz/sprig build
      - name: Package
        run: |
          mkdir -p dist
          pnpm --config.allow-unused-patches=true \
            --filter @buzz/sprig deploy --legacy --prod dist/sprig
          tar -C dist -czf dist/sprig-typescript.tar.gz sprig
          sha256sum dist/sprig-typescript.tar.gz > dist/sprig-typescript.tar.gz.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/sprig-typescript.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sprig-typescript
          path: |
            dist/sprig-typescript.tar.gz
            dist/sprig-typescript.tar.gz.sha256
      - name: Upload tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/sprig-typescript.tar.gz \
            dist/sprig-typescript.tar.gz.sha256 --clobber
