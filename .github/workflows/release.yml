name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CI: "true"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.18.0"

jobs:
  desktop:
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript distribution
        run: node --experimental-strip-types scripts/package-desktop.mts --archive --platform ${{ matrix.platform }}
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/buzz-desktop-${{ matrix.platform }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-desktop-${{ matrix.platform }}
          path: dist/buzz-desktop-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  sprig:
    name: Sprig TypeScript distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buzz/sprig build
      - name: Assemble Sprig
        run: |
          pnpm --config.allow-unused-patches=true \
            --filter @buzz/sprig deploy --legacy --prod dist/sprig
          tar -C dist -czf dist/sprig-typescript.tar.gz sprig
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/sprig-typescript.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sprig-typescript
          path: dist/sprig-typescript.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [desktop, sprig]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create archive checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
      - name: Create release if needed and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Buzz $TAG" --generate-notes
          gh release upload "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --clobber
